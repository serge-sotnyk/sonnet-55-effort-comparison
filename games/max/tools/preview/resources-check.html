<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Resources art integration check</title>
<style>
  body { font: 12px/1.4 ui-monospace, Menlo, monospace; background: #15191a; color: #d8e0d0; margin: 12px; }
  .ok { color: #8fe38f; } .bad { color: #ff8a8a; } pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h3>js/art/resources.js integration check</h3>
<pre id="out">running...</pre>
<script type="module">
// Calls every exported function with every kind x variant x fill (plus garbage input), asserts no exception / empty canvas,
// verifies the cache returns identical objects, and reports generation time per sprite.
// Console: one line  RESOURCES_CHECK {json}.  Query: ?quick=1 (fewer garbage combos)  ?scale=1|2
import { setSpriteScale, getSpriteScale } from '../../js/art/common.js';
const q = new URLSearchParams(location.search);
setSpriteScale(q.get('scale') ? Number(q.get('scale')) : (window.devicePixelRatio >= 1.5 ? 2 : 1));
const SCALE = getSpriteScale();
const R = await import('../../js/art/resources.js');

const errors = [];
const fail = (msg) => { errors.push(msg); };
const now = () => performance.now();
const probe = document.createElement('canvas'); probe.width = 1; probe.height = 1;
const pctx = probe.getContext('2d', { willReadFrequently: true });

/** bounding box of non-transparent pixels (checker only; the engine never does getImageData) */
function alphaInfo(cv) {
  const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height;
  const c = t.getContext('2d', { willReadFrequently: true }); c.drawImage(cv, 0, 0);
  const d = c.getImageData(0, 0, t.width, t.height).data;
  let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, n = 0;
  for (let y = 0; y < t.height; y++) for (let x = 0; x < t.width; x++) {
    if (d[(y * t.width + x) * 4 + 3] > 12) { n++; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  return { n, minX, minY, maxX, maxY };
}
function checkSprite(label, sp, opt = {}) {
  if (!sp || typeof sp !== 'object') return fail(label + ': not an object');
  const { canvas, w, h, ax, ay } = sp;
  if (!(canvas instanceof HTMLCanvasElement)) return fail(label + ': canvas missing');
  if (!Number.isInteger(w) || !Number.isInteger(h) || w < 1 || h < 1) fail(label + ': non-integer w/h ' + w + 'x' + h);
  if (canvas.width !== w * SCALE || canvas.height !== h * SCALE) fail(label + ': backing store ' + canvas.width + 'x' + canvas.height + ' != ' + w + 'x' + h + ' * ' + SCALE);
  if (!Number.isFinite(ax) || !Number.isFinite(ay) || ax < 0 || ay < 0 || ax > w || ay > h) fail(label + ': anchor outside ' + ax + ',' + ay);
  if (opt.skipAlpha) return;
  const a = alphaInfo(canvas);
  if (a.n < 8 * SCALE * SCALE) fail(label + ': (nearly) empty canvas, opaque px=' + a.n);
  else {
    const m = 2 * SCALE;                                        // spec: >= 2 logical px transparent margin (alpha > 12/255 counts as content)
    const tight = [];
    if (a.minX < m) tight.push('left'); if (a.minY < m) tight.push('top'); if (a.maxX > canvas.width - 1 - m) tight.push('right'); if (a.maxY > canvas.height - 1 - m) tight.push('bottom');
    if (tight.length) fail(label + ': content touches canvas edge (' + tight.join(',') + ') bbox ' + [a.minX, a.minY, a.maxX, a.maxY].join(',') + ' of ' + canvas.width + 'x' + canvas.height);
    return a;
  }
}

const result = { scale: SCALE, ua: navigator.userAgent.replace(/.*Chrome\//, 'Chrome/').slice(0, 20) };
const timings = { tree: [], stump: [], berries: [], gold_mine: [], stone_mine: [], carcass: [], decor: [], icon: [] };
const flush = (cv) => { try { cv.getContext('2d').getImageData(0, 0, 1, 1); } catch (e) { /* ignore */ } };   // forces the queued drawing to be rasterised
const timed = (bucket, fn) => { const t0 = now(); const r = fn(); flush(r.canvas || r); const dt = now() - t0; timings[bucket].push(dt); return r; };

let calls = 0;
const KINDS = ['tree', 'stump', 'berries', 'gold_mine', 'stone_mine', 'carcass_deer', 'carcass_boar', 'carcass_sheep'];
const DECOR = ['tuft', 'flowers', 'rocks', 'mushrooms', 'fern', 'reeds', 'shrub', 'log', 'pebbles'];

// ---- API shape
for (const fn of ['getResourceSprite', 'treeVariantCount', 'getDecorSprite', 'decorVariantCount', 'getResourceIcon', 'warmResourceSprites']) {
  if (typeof R[fn] !== 'function') fail('missing export ' + fn);
}
const nTrees = R.treeVariantCount();
if (!Number.isInteger(nTrees) || nTrees < 12) fail('treeVariantCount() = ' + nTrees + ' (need >= 12 integer)');
result.treeVariants = nTrees;

// ---- cold generation (each sprite generated once, timed incl. a readback that forces rasterisation)
const alphaBoxes = {};
for (let v = 0; v < nTrees; v++) {
  const sp = timed('tree', () => R.getResourceSprite('tree', v, 1)); calls++;
  const a = checkSprite('tree#' + v, sp);
  if (a) alphaBoxes['t' + v] = [Math.round(sp.ay - a.minY / SCALE), Math.round(sp.ax - a.minX / SCALE), Math.round(a.maxX / SCALE - sp.ax), Math.round(a.maxY / SCALE - sp.ay)];   // up, left, right, down of the anchor
  const st = timed('stump', () => R.getResourceSprite('stump', v, 1)); calls++;
  checkSprite('stump#' + v, st);
}
const FILLS = [1, 0.5, 0.1, 0];
const variantsOf = { berries: 3, gold_mine: 4, stone_mine: 4, carcass_deer: 2, carcass_boar: 2, carcass_sheep: 2 };
for (const kind of KINDS.slice(2)) {
  for (let v = 0; v < variantsOf[kind]; v++) for (const f of FILLS) {
    const bucket = kind.startsWith('carcass') ? 'carcass' : kind;
    const sp = timed(bucket, () => R.getResourceSprite(kind, v, f)); calls++;
    checkSprite(kind + '#' + v + '@' + f, sp);
  }
}
for (const kind of DECOR) {
  const n = R.decorVariantCount(kind);
  if (!Number.isInteger(n) || n < 4) fail('decorVariantCount(' + kind + ') = ' + n + ' (need >= 4)');
  for (let v = 0; v < n; v++) { const sp = timed('decor', () => R.getDecorSprite(kind, v)); calls++; checkSprite('decor ' + kind + '#' + v, sp); }
}
const ICONS = [...KINDS, 'food', 'wood', 'gold', 'stone'];
for (const k of ICONS) {
  const cv = timed('icon', () => R.getResourceIcon(k)); calls++;
  if (!(cv instanceof HTMLCanvasElement)) fail('icon ' + k + ': not a canvas');
  else {
    if (cv.width !== 24 * SCALE || cv.height !== 24 * SCALE) fail('icon ' + k + ': size ' + cv.width + 'x' + cv.height);
    const a = alphaInfo(cv);
    if (a.n < 30 * SCALE * SCALE) fail('icon ' + k + ': (nearly) empty');
    if (a.minX < 2 * SCALE - 1 || a.minY < 2 * SCALE - 1 || a.maxX > cv.width - 2 * SCALE || a.maxY > cv.height - 2 * SCALE) fail('icon ' + k + ': < ~2 px margin');
    if (R.getResourceIcon(k) !== cv) fail('icon ' + k + ': not cached');
  }
}
if (R.getResourceIcon('food') !== R.getResourceIcon('berries')) fail('alias food != berries');
if (R.getResourceIcon('wood') !== R.getResourceIcon('tree')) fail('alias wood != tree');
if (R.getResourceIcon('gold') !== R.getResourceIcon('gold_mine')) fail('alias gold != gold_mine');
if (R.getResourceIcon('stone') !== R.getResourceIcon('stone_mine')) fail('alias stone != stone_mine');

// ---- garbage input: nothing may throw, everything returns a usable sprite
const GARBAGE_KINDS = [undefined, null, '', 'nope', 0, 12, {}, [], 'TREE', 'tree ', '__proto__', 'constructor', 'toString', Symbol.iterator, () => 1];
const GARBAGE_VARIANTS = [undefined, null, NaN, -1, -7, -1e12, 1e12, 2 ** 31, 2 ** 32 + 3, 2.7, -2.7, '3', 'x', {}, [], Infinity, -Infinity, true, Symbol('v'), 10n, { valueOf() { throw new Error('boom'); } }];
const GARBAGE_FILLS = [undefined, null, NaN, -1, -0.5, 0, 0.0001, 0.33, 0.3300001, 0.5, 0.66, 0.6600001, 1, 1.5, 99, '0.5', 'x', {}, Infinity, -Infinity, Symbol('f'), 3n, { valueOf() { throw new Error('boom'); } }];
const safe = (x) => { try { return typeof x === 'symbol' ? 'symbol' : typeof x === 'bigint' ? x + 'n' : String(x); } catch (e) { return '<unprintable>'; } };
const guard = (label, fn) => { try { calls++; return fn(); } catch (e) { fail('THREW in ' + label + ': ' + (e && e.message)); return null; } };
for (const k of [...GARBAGE_KINDS, ...KINDS]) {
  for (const v of GARBAGE_VARIANTS) {
    const fillsToUse = q.get('quick') ? [undefined, 0.5, NaN] : GARBAGE_FILLS;
    for (const f of fillsToUse) {
      const sp = guard('getResourceSprite(' + safe(k) + ',' + safe(v) + ',' + safe(f) + ')', () => R.getResourceSprite(k, v, f));
      if (!sp || !sp.canvas || !(sp.w > 0) || !(sp.h > 0) || !Number.isFinite(sp.ax) || !Number.isFinite(sp.ay)) fail('bad sprite for garbage ' + safe(k) + ',' + safe(v) + ',' + safe(f));
    }
  }
}
for (const k of [...GARBAGE_KINDS, ...DECOR]) {
  const n = guard('decorVariantCount(garbage)', () => R.decorVariantCount(k));
  if (!(n >= 1)) fail('decorVariantCount(garbage ' + safe(k) + ') = ' + n);
  for (const v of GARBAGE_VARIANTS) {
    const sp = guard('getDecorSprite(garbage)', () => R.getDecorSprite(k, v));
    if (!sp || !sp.canvas || !(sp.w > 0)) fail('bad decor sprite for garbage ' + safe(k) + ',' + String(v));
  }
}
for (const k of GARBAGE_KINDS) {
  const c = guard('getResourceIcon(garbage)', () => R.getResourceIcon(k));
  if (!(c instanceof HTMLCanvasElement) || c.width !== 24 * SCALE) fail('bad icon for garbage ' + safe(k));
}
// defaults: no params at all
guard('getResourceSprite()', () => R.getResourceSprite()); guard('getDecorSprite()', () => R.getDecorSprite()); guard('getResourceIcon()', () => R.getResourceIcon());

// ---- caching: identical objects on repeated calls, variants wrap by modulo, fill levels map as specified
const same = (a, b, label) => { if (a !== b) fail('cache miss / different object: ' + label); };
for (let v = 0; v < nTrees; v++) {
  same(R.getResourceSprite('tree', v), R.getResourceSprite('tree', v, 0.2), 'tree#' + v + ' fill-insensitive');
  same(R.getResourceSprite('tree', v), R.getResourceSprite('tree', v + nTrees), 'tree#' + v + ' wraps +N');
  same(R.getResourceSprite('tree', v), R.getResourceSprite('tree', v - nTrees * 3), 'tree#' + v + ' wraps negative');
  same(R.getResourceSprite('stump', v), R.getResourceSprite('stump', v + nTrees), 'stump#' + v + ' wraps');
}
for (const kind of KINDS.slice(2)) {
  same(R.getResourceSprite(kind, 0, 1), R.getResourceSprite(kind, 0, 0.9), kind + ' fill>0.66 -> same level');
  same(R.getResourceSprite(kind, 0, 0.5), R.getResourceSprite(kind, 0, 0.67 - 0.01), kind + ' fill 0.5 / 0.66');
  same(R.getResourceSprite(kind, 0, 0.34), R.getResourceSprite(kind, 0, 0.66), kind + ' fill 0.34 / 0.66 (middle level)');
  same(R.getResourceSprite(kind, 0, 0.33), R.getResourceSprite(kind, 0, 0), kind + ' fill 0.33 / 0 (low level)');
  same(R.getResourceSprite(kind, 0, 1), R.getResourceSprite(kind, 0, undefined), kind + ' undefined fill = full');
  same(R.getResourceSprite(kind, 0, 1), R.getResourceSprite(kind, 0, 7), kind + ' fill clamp high');
  same(R.getResourceSprite(kind, 0, 0), R.getResourceSprite(kind, 0, -3), kind + ' fill clamp low');
  if (R.getResourceSprite(kind, 0, 1) === R.getResourceSprite(kind, 0, 0)) fail(kind + ': full and empty must differ');
  if (R.getResourceSprite(kind, 0, 1) === R.getResourceSprite(kind, 0, 0.5)) fail(kind + ': full and half must differ');
}
for (const kind of DECOR) {
  const n = R.decorVariantCount(kind);
  for (let v = 0; v < n; v++) same(R.getDecorSprite(kind, v), R.getDecorSprite(kind, v + n * 5), 'decor ' + kind + '#' + v + ' wraps');
}
same(R.getResourceSprite('nope'), R.getResourceSprite(undefined, 5, 5), 'fallback sprite is shared');

// ---- determinism: building the same sprite twice from scratch must give identical pixels (seeded rng, no Math.random)
{
  const T = await import('../../js/art/resources_trees.js');
  const N = await import('../../js/art/resources_nodes.js');
  const A = await import('../../js/art/resources_animals.js');
  const D = await import('../../js/art/resources_decor.js');
  const pairs = [
    ['tree#0', () => T.buildTree(0)], ['tree#12', () => T.buildTree(12)], ['tree#21', () => T.buildTree(21)], ['tree#29', () => T.buildTree(29)],
    ['stump#3', () => N.buildStump(3)], ['berries', () => N.buildBerries(1, 2)], ['gold', () => N.buildMine('gold_mine', 2, 2)], ['stone', () => N.buildMine('stone_mine', 1, 1)],
    ['deer', () => A.buildCarcass('carcass_deer', 1, 1)], ['sheep', () => A.buildCarcass('carcass_sheep', 0, 0)], ['fern', () => D.buildDecor(4, 2)], ['log', () => D.buildDecor(7, 1)],
  ];
  for (const [label, fn] of pairs) {
    const a = fn().canvas.toDataURL(), b = fn().canvas.toDataURL();
    if (a !== b) fail('non-deterministic: ' + label);
  }
  result.deterministic = errors.filter((e) => e.startsWith('non-deterministic')).length === 0;
}

// ---- warm: resolves, nothing regenerated afterwards
const snapshot = KINDS.map((k) => R.getResourceSprite(k, 0, 1));
let progressCalls = 0, lastTotal = 0;
const tw = now();
const warmed = await R.warmResourceSprites((d, t) => { progressCalls++; lastTotal = t; });
result.warmMs = Math.round(now() - tw);
result.warmCount = warmed;
KINDS.forEach((k, i) => same(snapshot[i], R.getResourceSprite(k, 0, 1), 'warm kept identity of ' + k));
if (!(warmed > 100)) fail('warmResourceSprites resolved with ' + warmed);
if (progressCalls < 1) fail('warm progress callback never fired');

// ---- hot path micro-benchmark (cached lookups)
{
  let sink = 0;
  const N = 2000000;
  const heap0 = performance.memory ? performance.memory.usedJSHeapSize : 0;
  let t0 = now();
  for (let i = 0; i < N; i++) { sink += R.getResourceSprite('tree', i, 1).w; }
  const treeNs = (now() - t0) * 1e6 / N;
  t0 = now();
  for (let i = 0; i < N; i++) { sink += R.getResourceSprite('berries', i, (i & 7) / 7).w; }
  const berryNs = (now() - t0) * 1e6 / N;
  t0 = now();
  for (let i = 0; i < N; i++) { sink += R.getDecorSprite('flowers', i).w; }
  const decorNs = (now() - t0) * 1e6 / N;
  const heap1 = performance.memory ? performance.memory.usedJSHeapSize : 0;
  result.hotNs = { tree: +treeNs.toFixed(1), berries: +berryNs.toFixed(1), decor: +decorNs.toFixed(1) };
  result.hotHeapDeltaKB = Math.round((heap1 - heap0) / 1024);
  result.sink = sink > 0;
}

// ---- regeneration benchmark (bypasses the cache; medians of 5 runs per tree variant, JIT warm)
{
  const T = await import('../../js/art/resources_trees.js');
  const N = await import('../../js/art/resources_nodes.js');
  const median = (a) => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
  const trees = [];
  for (let v = 0; v < T.TREE_COUNT; v++) {
    const runs = [];
    for (let r = 0; r < 5; r++) { const t0 = now(); const sp = T.buildTree(v); flush(sp.canvas); runs.push(now() - t0); }
    trees.push(+median(runs).toFixed(2));
  }
  result.treeRegenMedianMs = trees;
  result.treeRegenAvgMs = +(trees.reduce((a, b) => a + b, 0) / trees.length).toFixed(2);
  result.treeRegenMaxMs = Math.max(...trees);
  const mines = [];
  for (const kind of ['gold_mine', 'stone_mine']) for (let lv = 0; lv < 3; lv++) { const runs = []; for (let r = 0; r < 5; r++) { const t0 = now(); const sp = N.buildMine(kind, 1, lv); flush(sp.canvas); runs.push(now() - t0); } mines.push(+median(runs).toFixed(2)); }
  result.mineRegenMedianMs = mines;
}

// ---- stats
const stat = (a) => (a.length ? { n: a.length, avg: +(a.reduce((s, x) => s + x, 0) / a.length).toFixed(2), max: +Math.max(...a).toFixed(2) } : null);
result.genMs = {}; for (const k of Object.keys(timings)) result.genMs[k] = stat(timings[k]);
result.calls = calls;
result.treeBoxUpLeftRightDown = alphaBoxes;
result.errors = errors.length;
result.ok = errors.length === 0;
if (errors.length) result.firstErrors = errors.slice(0, 12);

const out = document.getElementById('out');
out.innerHTML = (result.ok ? '<span class="ok">ALL CHECKS PASSED</span>' : '<span class="bad">' + errors.length + ' PROBLEMS</span>') + '\n\n' + JSON.stringify(result, null, 2) + (errors.length ? '\n\n' + errors.slice(0, 60).join('\n') : '');
console.log('RESOURCES_CHECK ' + JSON.stringify(result));
if (errors.length) console.log('RESOURCES_CHECK_ERRORS ' + JSON.stringify(errors.slice(0, 40)));
window.__check = result;
window.__done = true;
</script>
</body>
</html>

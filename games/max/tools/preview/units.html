<!doctype html>
<meta charset="utf-8">
<title>Age of Crowns - units art contact sheets</title>
<style>
  html, body { margin: 0; background: #587f43; font: 11px monospace; color: #fff; }
  canvas { display: block; }
  #nav { position: fixed; right: 4px; top: 4px; background: rgba(0,0,0,.55); padding: 4px 8px; z-index: 5; }
  #nav a { color: #ffd; margin-right: 8px; }
</style>
<div id="nav"></div>
<canvas id="c"></canvas>
<script type="module">
import { setSpriteScale } from '../../js/art/common.js';
setSpriteScale(window.devicePixelRatio >= 1.5 ? 2 : 1);
const U = await import('../../js/art/units.js');
const q = new URLSearchParams(location.search);
const section = q.get('section') || 'dirs';          // dirs | walk | attack | work | death | battle | variants
const page = +(q.get('page') || 0);
const per = +(q.get('per') || 8);
const zoom = +(q.get('zoom') || 2);
const teamQ = q.get('team') || 'both';                // 1 | 2 | both
const dirQ = +(q.get('dir') || 7);
const only = q.get('types') ? q.get('types').split(',') : null;
const all = U.allUnitTypes();
const types = only || all;
const kindOf = t => U.unitKind(t);
const cellFor = (t) => { const k = kindOf(t); return k === 'mounted' ? [92, 86] : k === 'siege' ? (t === 'trebuchet' ? [130, 110] : [110, 84]) : k === 'beast' ? [64, 56] : [52, 66]; };

const cv = document.getElementById('c'), dpr = window.devicePixelRatio;
const nav = document.getElementById('nav');
nav.innerHTML = ['dirs', 'walk', 'attack', 'work', 'death', 'battle'].map(s => `<a href="?section=${s}">${s}</a>`).join('');

function setup(W, H, bg = '#587f43') {
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  return ctx;
}
function drawSprite(ctx, s, x, y, z, shadow = [9, 4.5]) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x + 1 * z, y + 1 * z, shadow[0] * z, shadow[1] * z, 0, 0, 6.3); ctx.fill();
  ctx.drawImage(s.canvas, x - s.ax * z, y - s.ay * z, s.w * z, s.h * z);
}
const shadowOf = (t) => { const k = kindOf(t); return k === 'mounted' ? [14, 7] : k === 'siege' ? (t === 'trebuchet' ? [22, 11] : [17, 8.5]) : k === 'beast' ? [10, 5] : [8, 4]; };

const t0 = performance.now();
let info = '';

if (section === 'battle') {
  const W = +(q.get('w') || 1500) , H = +(q.get('h') || 700), z = zoom;
  const ctx = setup(W, H, '#4f7a3a');
  // ground tiles
  for (let ty = -6; ty < 40; ty++) for (let tx = -6; tx < 40; tx++) {
    const sx = (tx - ty) * 32 * z + W / 2 - 200 * z / 2, sy = (tx + ty) * 16 * z - 60 * z;
    if (sx < -80 || sx > W + 80 || sy < -40 || sy > H + 40) continue;
    const v = ((tx * 7 + ty * 13) % 5) / 5;
    ctx.fillStyle = `hsl(${96 + v * 6}, ${34 + v * 6}%, ${33 + ((tx + ty) & 1) * 1.5 + v * 3}%)`;
    ctx.beginPath(); ctx.moveTo(sx, sy - 16 * z); ctx.lineTo(sx + 32 * z, sy); ctx.lineTo(sx, sy + 16 * z); ctx.lineTo(sx - 32 * z, sy); ctx.closePath(); ctx.fill();
  }
  // army formation in world tile coords; draw sorted by depth
  const list = [];
  const add = (t, team, x, y, dir, anim, frame, opts) => list.push({ t, team, x, y, dir, anim, frame, opts });
  // blue army (west) facing east/SE, red army (east) facing west/NW
  const blue = [['spearman', 6], ['militia', 6], ['archer', 6], ['crossbowman', 4], ['knight', 4], ['champion', 3], ['halberdier', 3], ['monk', 1]];
  let cx = 0;
  const row = (types, team, x0, y0, dir, anim) => { types.forEach((t, i) => add(t, team, x0 + (i % 2) * 0.9, y0 + i * 1.1, dir, anim, (i * 3 + 1) % 8)); };
  row(['spearman', 'spearman', 'militia', 'militia', 'man_at_arms', 'long_swordsman', 'two_handed', 'champion'], 1, 10, 6, 0, 'attack');
  row(['archer', 'archer', 'crossbowman', 'arbalester', 'longbowman', 'skirmisher', 'elite_skirmisher', 'throwing_axeman'], 1, 7.8, 6.5, 0, 'idle');
  row(['knight', 'cavalier', 'paladin', 'scout', 'hussar'], 1, 11.6, 6, 7, 'walk');
  row(['spearman', 'pikeman', 'militia', 'halberdier', 'huskarl', 'elite_huskarl', 'two_handed', 'champion'], 2, 12.6, 6.8, 4, 'attack');
  row(['archer', 'archer', 'crossbowman', 'arbalester', 'longbowman', 'elite_longbowman', 'skirmisher', 'elite_axeman'].map(t => t === 'elite_axeman' ? 'elite_throwing_axeman' : t), 2, 14.9, 6.2, 4, 'idle');
  row(['knight', 'cavalier', 'cavalry_archer', 'mangudai', 'camel', 'heavy_camel'], 2, 11.4, 7.5, 3, 'walk');
  add('ram', 1, 5, 11, 0, 'attack', 3); add('mangonel', 1, 4.0, 8.5, 0, 'idle', 0); add('scorpion', 2, 16.5, 10.5, 4, 'attack', 2); add('trebuchet', 2, 18, 8.4, 4, 'attack', 0);
  add('siege_ram', 2, 9.8, 12, 3, 'idle', 0); add('monk', 1, 6.3, 7.2, 0, 'attack', 2); add('monk', 2, 13.6, 6, 4, 'idle', 0);
  // villagers + animals on the left
  const works = ['chop', 'mine', 'farm', 'forage', 'butcher', 'build'];
  works.forEach((w, i) => add('villager', 1, 2 + (i % 3) * 1.2, 12.5 + Math.floor(i / 3) * 1.4, (i * 2 + 1) % 8, w, (i * 2) % 6, { variant: i }));
  ['food', 'wood', 'gold', 'stone'].forEach((c, i) => add('villager', 1, 1 + i * 1.1, 15.5, 1, 'walk', i * 2, { variant: i + 4, carry: c }));
  add('deer', 0, 2, 2, 0, 'idle', 1); add('deer', 0, 3.4, 2.8, 2, 'walk', 3); add('boar', 0, 1.2, 4.4, 3, 'idle', 0); add('wolf', 0, 4.8, 3.6, 4, 'attack', 3); add('sheep', 1, 3.2, 5.2, 1, 'idle', 2); add('sheep', 1, 4.2, 5.7, 5, 'idle', 0);
  list.forEach(o => { o.sx = (o.x - o.y) * 32 * z + W / 2 - 100 * z / 2 + 120 * z / 1; o.sy = (o.x + o.y) * 16 * z - 20 * z; });
  list.sort((a, b) => a.sy - b.sy);
  let n = 0;
  for (const o of list) {
    const s = U.getUnitSprite(o.t, o.team, o.dir, o.anim, o.frame, o.opts);
    drawSprite(ctx, s, o.sx - 40 * z, o.sy + 20 * z, z, shadowOf(o.t)); n++;
  }
  info = 'battle: ' + n + ' units';
} else {
  // gather rows
  const rows = [];   // {label, cells:[{t, team, dir, anim, frame, opts}]}
  const teams = teamQ === 'both' ? [1, 2] : [+teamQ];
  const slice = section === 'work' ? [] : types.slice(page * per, page * per + per);
  if (section === 'dirs') {
    for (const t of slice) for (const team of teams) rows.push({ label: t + ' t' + team, t, cells: [0, 1, 2, 3, 4, 5, 6, 7].map(d => ({ t, team, dir: d, anim: 'idle', frame: 0 })) });
  } else if (section === 'walk' || section === 'attack' || section === 'death') {
    const n = (t) => U.animFrames(t, section);
    for (const t of slice) for (const team of teams) rows.push({ label: t + ' t' + team + ' ' + section + ' d' + dirQ, t, cells: Array.from({ length: n(t) }, (_, f) => ({ t, team, dir: dirQ, anim: section, frame: f })) });
  } else if (section === 'work') {
    const works = ['idle', 'walk', 'attack', 'chop', 'mine', 'farm', 'forage', 'butcher', 'build', 'death'];
    for (const w of works) for (const v of [0, 1]) rows.push({ label: 'villager ' + w + ' v' + v + ' d' + dirQ, t: 'villager', cells: Array.from({ length: U.animFrames('villager', w) }, (_, f) => ({ t: 'villager', team: 1, dir: dirQ, anim: w, frame: f, opts: { variant: v } })) });
    for (const c of ['food', 'wood', 'gold', 'stone']) rows.push({ label: 'villager carry ' + c, t: 'villager', cells: Array.from({ length: 8 }, (_, f) => ({ t: 'villager', team: 1, dir: dirQ, anim: 'walk', frame: f, opts: { variant: 2, carry: c } })).concat([0, 1, 2, 3, 4, 5, 6, 7].map(d => ({ t: 'villager', team: 2, dir: d, anim: 'idle', frame: 0, opts: { variant: 3, carry: c } }))) });
  } else if (section === 'variants') {
    for (const t of slice) rows.push({ label: t + ' variants', t, cells: [0, 1, 2, 3, 4, 5, 6, 7].map(v => ({ t, team: 1, dir: 1, anim: 'idle', frame: 0, opts: { variant: v } })) });
  }
  const rf = +(q.get('rowFrom') || 0), rc = +(q.get('rowCount') || 999);
  if (section === 'work') { const keep = rows.slice(rf, rf + rc); rows.length = 0; rows.push(...keep); }
  const cols = Math.max(...rows.map(r => r.cells.length));
  const rowH = rows.map(r => cellFor(r.t)[1] * zoom), colW = Math.max(...rows.map(r => cellFor(r.t)[0])) * zoom;
  const W = cols * colW, H = rowH.reduce((a, b) => a + b, 0) + 6;
  const ctx = setup(W, H);
  let y = 0, count = 0;
  rows.forEach((r, ri) => {
    const [cw, ch] = cellFor(r.t);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.fillText(r.label, 4, y + 11);
    r.cells.forEach((c, ci) => {
      const s = U.getUnitSprite(c.t, c.team, c.dir, c.anim, c.frame, c.opts);
      const x = (ci + 0.5) * colW, gy = y + ch * zoom * 0.8;
      ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.beginPath(); ctx.moveTo(x, gy - 16 * zoom); ctx.lineTo(x + 32 * zoom, gy); ctx.lineTo(x, gy + 16 * zoom); ctx.lineTo(x - 32 * zoom, gy); ctx.closePath(); ctx.stroke();
      drawSprite(ctx, s, x, gy, zoom, shadowOf(c.t)); count++;
    });
    y += rowH[ri];
  });
  info = section + ' page ' + page + ': ' + count + ' sprites';
}
const el = performance.now() - t0;
document.title = 'units ' + section;
console.log(info, 'in', el.toFixed(0), 'ms');
window.__done = true;
</script>
